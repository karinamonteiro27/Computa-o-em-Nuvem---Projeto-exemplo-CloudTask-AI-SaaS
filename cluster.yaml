apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: cloudtask-eks
  region: us-east-1
  version: "1.30"

iam:
  serviceRoleARN: "arn:aws:iam::474746395287:role/LabRole"

vpc:
  id: "vpc-06152f8a6416d7648"
  subnets:
    public:
      us-east-1a: { id: "subnet-0ca7af3b0d7c0a908" }
      us-east-1b: { id: "subnet-0af0e6ee059733cf4" }

managedNodeGroups:
  - name: std-nodes
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    iam:
      instanceRoleARN: "arn:aws:iam::474746395287:role/LabRole"
